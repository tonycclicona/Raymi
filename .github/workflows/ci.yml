name: CI/CD Pipeline - Hostinger Web Business

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. VALIDATION & CODE INTEGRITY CHECK (CI)
  # =========================================================================
  validate:
    name: Lint & Validate Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, pdo, pdo_mysql

      - name: Syntax Lint Check (Frontend, Admin, API)
        run: |
          echo "🔍 Validating PHP syntax across all modules..."
          ERRORS=0
          for f in $(find . -type f -name "*.php" ! -path "*/.*/*" ! -path "./vendor/*"); do
            php -l "$f" > /dev/null || { echo "❌ Syntax error in $f"; ERRORS=$((ERRORS + 1)); }
          done
          if [ $ERRORS -gt 0 ]; then
            echo "❌ Validation failed: $ERRORS file(s) contain PHP syntax errors."
            exit 1
          fi
          echo "✅ All PHP files passed syntax validation."

      - name: Validate JSON Data Files
        run: |
          echo "🔍 Validating persistence JSON files..."
          for j in database/data/*.json; do
            if [ -f "$j" ]; then
              python3 -m json.tool "$j" > /dev/null || { echo "❌ Invalid JSON in $j"; exit 1; }
            fi
          done
          echo "✅ All database JSON files are well-formed."

  # =========================================================================
  # 2. PRODUCTION DEPLOYMENT TO HOSTINGER (CD)
  # =========================================================================
  deploy:
    name: Deploy to Hostinger Production
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify Hostinger Deployment Secrets
        id: check_credentials
        run: |
          if [ -z "${{ secrets.HOSTINGER_FTP_HOST }}" ] || [ -z "${{ secrets.HOSTINGER_FTP_USER }}" ] || [ -z "${{ secrets.HOSTINGER_FTP_PASSWORD }}" ]; then
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "::warning title=Hostinger Credentials Not Found::The secrets HOSTINGER_FTP_HOST, HOSTINGER_FTP_USER, and HOSTINGER_FTP_PASSWORD are not yet configured in GitHub repository secrets. Deployment will activate automatically once these secrets are added."
          else
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Targeted Production Distributions
        run: |
          echo "📦 Packaging targeted production artifacts..."
          python3 scripts/build.py
          echo "✅ Production artifacts successfully packaged in dist/"

      - name: Deploy API Module (api.unu-raymi.com)
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          protocol: ftps
          security: loose
          local-dir: dist/api/
          server-dir: ${{ vars.HOSTINGER_API_DIR || 'domains/api.unu-raymi.com/public_html/' }}
          dangerous-clean-slate: false

      - name: Deploy Frontend Web App (unu-raymi.com)
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          protocol: ftps
          security: loose
          local-dir: dist/frontend/
          server-dir: ${{ vars.HOSTINGER_FRONTEND_DIR || 'domains/unu-raymi.com/public_html/' }}
          dangerous-clean-slate: false

      - name: Deploy Admin Panel (unu-raymi.com/admin)
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          protocol: ftps
          security: loose
          local-dir: dist/admin/
          server-dir: ${{ vars.HOSTINGER_ADMIN_DIR || 'domains/unu-raymi.com/public_html/admin/' }}
          dangerous-clean-slate: false
